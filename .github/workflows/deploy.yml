name: Deploy React App

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permiso para escribir en el repo
      pages: write # Permiso para GitHub Pages
      id-token: write # Para autenticación OIDC

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          full_commit_message: "Deploy to GitHub Pages (via GitHub Actions)"
          force_orphan: true
